- {id: a11, kind: invented, sentence: "Xe không lắp thiết bị giám sát hành trình bị phạt 2.000.000 đồng. [5]"}
- {id: a12, kind: bracket, sentence: "Điều khiển xe ô tô cứu hộ chở xe được cứu hộ vượt quá khối lượng cho phép bị phạt từ 3.000.000 đồng đến 5.000.000 đồng. [1]"}
- {id: a13, kind: bracket, sentence: "Người điều khiển xe máy không đội mũ bảo hiểm bị phạt từ 600.000 đồng đến 800.000 đồng. [4]"}
