# One fabricated sentence per Set A draft, planted to measure whether
# reflection (R7) catches what it exists for. The drafts themselves had
# nothing to catch (docs/retrieval-design.md §8.7).
#
# Each sentence was checked against the passages its draft was written from:
#   bracket  -- pairs an act in the sources with a penalty or limit the
#               sources give to something else, often in the same article.
#               The clause-head clause of the prompt could let these through.
#   number   -- a figure the sources state differently, or not at all.
#   invented -- a rule, penalty or duty the sources do not contain.

- {id: a01, kind: invented, sentence: "Ngoài phạt tiền, người lái ô tô vượt đèn đỏ còn bị tạm giữ phương tiện 07 ngày. [3]"}
- {id: a02, kind: invented, sentence: "Đường tỉnh phải có tối thiểu 4 làn xe. [1]"}
- {id: a03, kind: bracket, sentence: "Người đủ 16 tuổi chỉ được điều khiển xe gắn máy có dung tích xi-lanh dưới 125 cm3. [1]"}
- {id: a04, kind: invented, sentence: "Thời hạn này được gia hạn thêm tối đa 02 năm nếu phương tiện còn đủ điều kiện. [1]"}
- {id: a05, kind: invented, sentence: "Phương tiện chở trên 20 người còn phải có giấy phép vận tải do Bộ Xây dựng cấp. [3]"}
- {id: a06, kind: invented, sentence: "Chủ phương tiện còn bị tạm giữ phương tiện đến 07 ngày. [1]"}
- {id: a07, kind: number, sentence: "Hãng khai thác từ 11 đến 30 tàu bay cần vốn chủ sở hữu tối thiểu 500 tỷ đồng Việt Nam. [1]"}
