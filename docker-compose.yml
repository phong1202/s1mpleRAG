services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_beginner
    ports:
      # 5433 on the host: 5432 is already taken by an existing citus container.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_beginner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      # Container-to-container: the service name and the internal port 5432,
      # not the host's 5433.
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag_beginner
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
