services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    ports:
      - "${DB_PORT:?set DB_PORT in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      # The whole reason RABBITMQ_* is stored in parts: the broker needs the
      # credentials as its own variables, and app/config.py assembles the same
      # values into a URL. One source, two consumers.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:?set RABBITMQ_PORT in .env}:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # 6379 is literal because REDIS_URL is kept whole -- there is no
    # REDIS_PORT to reference, by the same decision.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    ports:
      - "${MINIO_PORT:?set MINIO_PORT in .env}:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets and exits. Not a long-running entrypoint: buckets are
  # a one-time job, and attaching it to minio's lifecycle would only make
  # minio slower to start.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
      MINIO_BUCKET_STAGING: ${MINIO_BUCKET_STAGING}
    # `mc ilm rule add` is NOT idempotent -- it mints a new rule ID on every
    # run, so repeated `compose up` would stack duplicate expiry rules on the
    # bucket forever. `import` replaces the whole lifecycle configuration from
    # the JSON below, which makes a re-run a no-op. Nothing is tolerated with
    # `|| true` any more: with the operations idempotent, a failure here is
    # real and should stop the container.
    entrypoint:
      - /bin/sh
      - -euc
      - |
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_RAW"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_STAGING"
        mc ilm rule import "local/$$MINIO_BUCKET_STAGING" <<'JSON'
        {"Rules":[{"ID":"expire-staging-7d","Status":"Enabled","Expiration":{"Days":7},"Filter":{}}]}
        JSON

  docling:
    build: ./docling_service
    environment:
      # Container-internal, literal like the other services -- not
      # MINIO_ENDPOINT, which is app/config.py's escape hatch for real S3
      # and is unset by default; ${MINIO_ENDPOINT} here would resolve to
      # an empty string.
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8100:8100"
    volumes:
      # Weights download once and are reused forever. The first run takes
      # real time and LOOKS EXACTLY LIKE A HANG -- that is normal.
      - doclingmodels:/models
    healthcheck:
      # Waits for the model to finish loading, not just for the port to
      # open -- otherwise a worker fires requests at a service that isn't
      # ready yet, and you end up debugging the wrong thing.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,json;
          assert json.load(urllib.request.urlopen('http://localhost:8100/health'))['models_loaded']"
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build: .
    env_file:
      - .env
    environment:
      # Container-to-container: service names and internal ports, not the
      # host-view values .env holds for running things directly on the
      # host. Environment entries beat env_file, and env vars beat the
      # bind-mounted .env inside the container.
      DB_HOST: db
      DB_PORT: 5432
      MINIO_HOST: minio
      MINIO_PORT: 9000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-cpu:
    build: .
    command: celery -A worker.celery_app worker -Q cpu -c 8 -l info
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MINIO_HOST: minio
      MINIO_PORT: 9000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_URL: redis://redis:6379/0
      # Only this worker calls Docling: S1 parse is the only stage that
      # does, and it is routed to the cpu queue.
      DOCLING_URL: http://docling:8100
      # celery's own process gets /code on sys.path to resolve `-A
      # worker.celery_app`, but its prefork pool forks task-executing child
      # processes that do NOT inherit that -- found because every stage
      # task lazily imports shared.storage/worker.* *inside* the function
      # body, and that import only runs later, inside a forked child,
      # where it fails with "No module named 'shared'". Top-level imports
      # in worker/stages.py never hit this, which is why task routing and
      # the state machine (task 11) tested fine with nothing wired in yet.
      PYTHONPATH: /code
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Not service_healthy: that would block worker-cpu -- which also
      # runs structure/persist, neither touching Docling -- on the full
      # model load every time. A parse task that lands before Docling is
      # ready just retries with backoff, the same as any other transient
      # failure.
      docling:
        condition: service_started
    volumes:
      - .:/code

  worker-llm:
    build: .
    command: celery -A worker.celery_app worker -Q llm -c 20 -l info
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MINIO_HOST: minio
      MINIO_PORT: 9000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_URL: redis://redis:6379/0
      # Same reason as worker-cpu: celery's prefork children do not
      # inherit the main process's /code on sys.path.
      PYTHONPATH: /code
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/code

volumes:
  pgdata:
  miniodata:
  doclingmodels:
