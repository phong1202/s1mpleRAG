name: CI

# Only where main is at stake: a pull request into it, and main itself after
# a merge or a direct push. Work-in-progress pushes to other branches do not
# run anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the run before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The dev group alone: ruff does not need the application's dependencies.
      - run: uv sync --locked --only-dev
      # The same two checks as the pre-commit hook in README.md ("Linting"),
      # which lives in .git/hooks and so does not travel with a clone.
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # .env.example is a complete local configuration: service addresses on
      # localhost, default credentials, and LLM_PROVIDER=stub, so nothing here
      # needs a secret or reaches a paid API.
      - name: Configure environment
        run: cp .env.example .env
      # The suite runs against the real services, not mocks (README.md,
      # "Testing"), so they come from the project's own compose file.
      # minio-init creates the buckets and the staging expiry rule, and exits.
      - name: Start Postgres, RabbitMQ, Redis and MinIO
        run: |
          docker compose up -d --wait db rabbitmq redis minio
          docker compose up --exit-code-from minio-init minio-init
      # test_ocr_service.py talks to the real Chandra server, which needs a
      # GPU. Every other test that touches OCR replaces it with a fake.
      - name: Run tests
        run: uv run --no-sync pytest --ignore=tests/test_ocr_service.py
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color db rabbitmq redis minio

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned by packageManager in web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `next build` type-checks as part of the build, so this is the type
      # check as well as the build.
      - run: pnpm build
